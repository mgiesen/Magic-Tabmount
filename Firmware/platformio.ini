;===================================
; Environment Selection
;===================================
[platformio]
default_envs = usb-fast

;===================================
; Base Configuration
;===================================
[env]
platform = espressif32                              ; Definiert ESP32 als Zielplattform
board = esp32-s3-devkitc-1                          ; Spezifiziert das ESP32-S3 DevKit als Entwicklungsboard
framework = arduino                                 ; Nutzt Arduino Framework für die Entwicklung
monitor_speed = 115200                              ; Setzt die serielle Monitor-Baudrate auf 115200
board_build.filesystem = littlefs                   ; Web-Assets (data/) werden als LittleFS auf den Flash geschrieben

;===================================
; Library Dependencies
;===================================
lib_deps =
    mathieucarbou/AsyncTCP@^3.3.2                   ; Asynchrone TCP-Kommunikation (Fork, Core 3.x kompatibel)
    mathieucarbou/ESPAsyncWebServer@^3.6.0          ; Asynchroner Webserver (Fork, Core 3.x kompatibel)
    adafruit/Adafruit NeoPixel@^1.12.3              ; Steuerung der Logo-RGB-LEDs (NeoPixel/WS2812)
    laurb9/StepperDriver@^1.4.1                      ; A4988-Treiber fuer den Stepper-Motor (Display-Trigger)
    adafruit/Adafruit MCP4725@^2.0.2                 ; DAC zur Einstellung des Motorstroms (A4988 Vref)
    bblanchon/ArduinoJson@^7.2.0                     ; JSON-Serialisierung fuer die WebSocket-Kommunikation
    iavorvel/MyLD2410@^1.2.8                          ; Kommunikation mit dem LD2410 Presence-Sensor (UART)

;===================================
; Debug Configuration
;===================================
monitor_filters = esp32_exception_decoder           ; Aktiviert Exception Decoding für bessere Fehlermeldungen

;===================================
; USB Upload Environment
;===================================
[env:usb]
upload_protocol = esptool                           ; Nutzt ESPTool für USB-Upload
upload_speed = 115200                               ; Reduzierte Upload-Geschwindigkeit für mehr Stabilität
monitor_rts = 0                                     ; RTS Kontrolle deaktivieren
monitor_dtr = 0                                     ; DTR Kontrolle deaktivieren

[env:usb-fast]
upload_protocol = esptool                           ; Nutzt ESPTool für USB-Upload
upload_speed = 460800                               ; Mittlere Upload-Geschwindigkeit
